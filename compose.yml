services:
  # 1. La Base de données (PostGIS)
  db:
    build: ./backend/database
    container_name: postgis_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=villes_france
    volumes:
      - ./backend/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d villes_france"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Le Backend (Spring Boot)
  api:
    build: ./backend
    container_name: spring_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/villes_france
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
    depends_on:
      db:
        condition: service_healthy

  # 3. Le Frontend (React + Vite)
  frontend:
    build: ./frontend
    container_name: vite_app
    ports:
      - "3000:80"
    depends_on:
      - api